name: Build image

# Costruisce l'immagine unica dell'app (API + worker + SPA) e la pubblica su
# GitHub Container Registry. Su pull request fa solo build, senza push.
#
# Immagine: ghcr.io/<owner>/mdbup
# Tag: latest (solo branch di default), sha-<commit>, nome branch/tag.
#
# Nota: il primo push crea il package GHCR. Se il package deve essere pubblico,
# impostarne la visibilità una volta da GitHub → Packages → mdbup → Settings.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "frontend/tsconfig*.json"
      - "deploy/Dockerfile.api"
      - ".github/workflows/build-image.yml"
  pull_request:
    paths:
      - "backend/app/**"
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/pyproject.toml"
      - "backend/uv.lock"
      - "frontend/src/**"
      - "frontend/public/**"
      - "frontend/index.html"
      - "frontend/package.json"
      - "frontend/package-lock.json"
      - "frontend/vite.config.ts"
      - "frontend/tsconfig*.json"
      - "deploy/Dockerfile.api"
      - ".github/workflows/build-image.yml"
  workflow_dispatch:
    inputs:
      platforms:
        description: "Piattaforme Buildx separate da virgola"
        required: true
        default: "linux/amd64"
        type: string

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/mdbup
  PLATFORMS: ${{ github.event.inputs.platforms || 'linux/amd64' }}

jobs:
  build:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Normalize image name
        id: image
        shell: bash
        run: echo "name=${IMAGE_NAME,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=MdbUP
            org.opencontainers.image.description=Self-hosted catalogo streaming italiano e sync liste MDBList
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.api
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api
          cache-to: type=gha,scope=api,mode=max
          provenance: mode=max
          sbom: true

      - name: Summary
        run: |
          {
            echo "### Immagine MdbUP"
            echo ""
            echo "- Digest: \`${{ steps.build.outputs.digest }}\`"
            echo "- Piattaforme: \`${{ env.PLATFORMS }}\`"
            echo "- Push: \`${{ github.event_name != 'pull_request' }}\`"
            echo ""
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
