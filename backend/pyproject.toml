[project]
name = "mdbup-backend"
version = "0.2.0"
description = "MdbUP backend: streaming catalog acquisition and MDBList synchronization"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "celery[redis]>=5.4,<6",
  "redis>=6.1,<7",
  "argon2-cffi>=23.1,<25",
  "cryptography>=50,<51",
  "email-validator>=2.2,<3",
  "croniter>=2.0,<3",
  "structlog>=24.1,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-asyncio>=1.5,<2",
  "pytest-cov>=6,<8",
  "pgserver>=0.1",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-croniter>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = false

[tool.coverage.run]
source = ["app"]
branch = false

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
