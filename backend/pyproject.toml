[project]
name = "mdbup-backend"
version = "0.2.0"
description = "MdbUP backend: streaming catalog acquisition and MDBList synchronization"
requires-python = ">=3.12,<3.14"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "celery[redis]>=5.4,<6",
  "packaging>=24,<26",
  "redis>=6.1,<7",
  "argon2-cffi>=23.1,<25",
  "cryptography>=43,<46",
  "python-multipart>=0.0.9,<1",
  "email-validator>=2.2,<3",
  "croniter>=2.0,<3",
  "structlog>=24.1,<26",
  "orjson>=3.10,<4",
  "python-dateutil>=2.9,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "pytest-cov>=5,<7",
  "respx>=0.21,<1",
  "ruff>=0.6,<1",
  "mypy>=1.11,<2",
  "types-python-dateutil>=2.9",
  "freezegun>=1.5,<2",
  "pgserver>=0.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
warn_unused_ignores = false
