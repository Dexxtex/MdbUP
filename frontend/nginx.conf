# MdbUP — configurazione Nginx del frontend (runtime dell'immagine mdbup-frontend).
#
# Responsabilità: servire la SPA compilata da Vite sulla porta 8080, con fallback
# su index.html per le rotte client-side e un endpoint /healthz per l'healthcheck
# del compose. TLS, header di sicurezza e routing /api/* sono del proxy Caddy.
#
# Il processo gira come UID 101 (utente `nginx`) con rootfs read-only:
# /var/cache/nginx e /var/run sono tmpfs montati dal compose.

worker_processes auto;
pid /var/run/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /dev/stdout;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    server_tokens off;

    client_max_body_size 2m;

    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path /var/cache/nginx/proxy_temp;
    fastcgi_temp_path /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path /var/cache/nginx/uwsgi_temp;
    scgi_temp_path /var/cache/nginx/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    server {
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Liveness del container: nessuna dipendenza esterna.
        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        # Asset con hash nel nome: cache lunga e immutabile.
        location /assets/ {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # index.html mai in cache: un deploy deve essere visibile subito.
        location = /index.html {
            add_header Cache-Control "no-store";
        }

        # SPA fallback: ogni rotta client-side serve index.html.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
