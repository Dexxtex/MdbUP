# ==============================================================================
# MdbUP — Stack compatto a 4 servizi (API + Frontend, Worker + Beat, DB, Redis)
# Avvio / aggiornamento: docker compose up -d --remove-orphans
# ==============================================================================
name: mdbup

# Rotazione automatica dei log per evitare che riempiano il disco del server
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

# Configurazione condivisa tra 'api' e 'worker' (stessa immagine, stesse variabili)
x-app: &app
  image: ${MDBUP_IMAGE:-ghcr.io/dexxtex/mdbup:latest}
  env_file:
    - ../.env
  environment:
    APP_ENV: ${APP_ENV:-production}
    APP_BASE_URL: ${APP_BASE_URL:-http://localhost:28080}
    APP_TIMEZONE: ${APP_TIMEZONE:-Europe/Rome}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    LOG_FORMAT: ${LOG_FORMAT:-json}
    COOKIE_SECURE: ${COOKIE_SECURE:-false}
    SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-mdbsync-session}
    CSRF_COOKIE_NAME: ${CSRF_COOKIE_NAME:-mdbsync-csrf}
    METRICS_ENABLED: ${METRICS_ENABLED:-true}
    BACKUP_DIR: /backups
    BACKUP_STATUS_FILE: /backups/last_backup.json
  secrets:
    - app_encryption_key
    - bootstrap_token
  volumes:
    # Cartella backup montata in sola lettura per mostrarne lo stato nella UI
    - ${BACKUP_HOST_DIR:-../backups}:/backups:ro
  # Hardening sicurezza: utente non-root, filesystem in sola lettura, privilegi minimi
  user: "10001:10001"
  read_only: true
  init: true
  tmpfs:
    - /tmp:size=64m,mode=1777
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  restart: unless-stopped
  logging: *logging

services:
  # 1. API & FRONTEND WEB
  # Applica le migrazioni DB all'avvio e serve sia le API (/api/*) sia la UI React
  api:
    <<: *app
    command: ["sh", "-c", "alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"]
    ports:
      # Unica porta esposta sull'host (Frontend + API). Configurabile nel .env con WEB_PORT
      - "${WEB_PORT:-28080}:8000"
    cpus: 1.0
    mem_limit: 512m
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import sys, urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 2. WORKER & SCHEDULER (Celery + Beat integrato)
  # Esegue in background le acquisizioni TMDb/JustWatch, i sync MDBList e le notifiche
  worker:
    <<: *app
    command: ["celery", "-A", "app.jobs.celery_app", "worker", "-B", "-s", "/tmp/celerybeat-schedule", "-Q", "acquisitions,sync,maintenance", "-c", "2", "--max-tasks-per-child=200"]
    cpus: 1.0
    mem_limit: 768m
    stop_grace_period: 60s
    depends_on:
      api:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.jobs.celery_app inspect ping -d celery@$$HOSTNAME"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 3. DATABASE (PostgreSQL)
  # Isolato nella rete interna Docker (nessuna porta aperta sull'host)
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mdbup}
      POSTGRES_USER: ${POSTGRES_USER:-mdbup}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=60"]
    cpus: 1.0
    mem_limit: 1g
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # 4. CODA & CACHE (Redis)
  # Gestisce le code Celery, i lock anti-sovrapposizione e il rate-limit del login
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redisdata:/data
    cpus: 0.5
    mem_limit: 320m
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

# Volumi persistenti gestiti da Docker per i dati del database e di Redis
volumes:
  pgdata:
  redisdata:

# Chiavi e password lette da file locali (mai salvate in chiaro nel compose o nel .env)
secrets:
  postgres_password:
    file: ../secrets/postgres_password
  app_encryption_key:
    file: ../secrets/app_encryption_key
  bootstrap_token:
    file: ../secrets/bootstrap_token
